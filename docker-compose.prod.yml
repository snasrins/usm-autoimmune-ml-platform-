version: '3.8'

# ============================================
# PRODUCTION OVERLAY FOR RTX6000 DEPLOYMENT
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# This follows the Aras deployment pattern with nginx as the entry point
# ============================================

services:
  # === Backend (FastAPI) - Production Configuration ===
  fastapi:
    container_name: usm-autoimmune-backend-prod
    restart: unless-stopped
    ports:
      - "8000:8000"  # Internal port for nginx to access
    volumes:
      # Production: no bind mounts for code, keep data only
      - ./data:/data
      - ./models:/models
      - ./logs:/logs
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # === Frontend (React) - Production Build ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: usm-autoimmune-frontend-prod
    restart: unless-stopped
    ports: []  # No external ports - accessed through nginx only
    networks:
      - usm-network

  # === Nginx (Reverse Proxy) - Entry Point ===
  nginx:
    image: nginx:alpine
    container_name: usm-autoimmune-nginx
    restart: unless-stopped
    ports:
      - "8080:80"  # Using 8080 to avoid conflict with Apache2 on port 80
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - usm-network
    depends_on:
      - fastapi
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === PostgreSQL - Production Configuration ===
  postgres:
    restart: unless-stopped
    ports:
      - "5432:5432"  # Keep accessible but not on TAILSCALE_IP

  # === MinIO - Production Configuration ===
  minio:
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"

networks:
  usm-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  minio_data:
    driver: local
